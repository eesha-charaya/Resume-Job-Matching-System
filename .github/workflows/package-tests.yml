name: Package tests

on:
  push:
    branches: [package]
    paths:
      - "package/**"
      - ".github/workflows/package-tests.yml"
  pull_request:
    paths:
      - "package/**"
      - ".github/workflows/package-tests.yml"

jobs:
  test-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e "./package[test]"
      - name: Import smoke test
        run: python -c "import resume_job_matcher; print(resume_job_matcher.__version__)"
      - name: Run tests
        run: pytest package/tests
