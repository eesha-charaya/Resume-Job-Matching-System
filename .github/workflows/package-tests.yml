name: Package tests

on:
  push:
    branches: [package]
    paths:
      - "package/**"
      - ".github/workflows/package-tests.yml"
  pull_request:
    paths:
      - "package/**"
      - ".github/workflows/package-tests.yml"

jobs:
  test-package:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install package and developer tools
        run: python -m pip install -e "./package[dev]"

      - name: Import smoke test
        run: python -c "import resume_job_matcher; print(resume_job_matcher.__version__)"

      - name: CLI smoke test
        run: resume-job-matcher clean "<p>Python &amp; Data Science</p>"

      - name: Run tests with coverage
        run: pytest package/tests --cov=resume_job_matcher --cov-report=term-missing

      - name: Lint
        run: ruff check package/src package/tests

      - name: Type check
        run: mypy package/src

      - name: Build wheel and source distribution
        run: python -m build package

      - name: Validate distributions
        run: python -m twine check package/dist/*
